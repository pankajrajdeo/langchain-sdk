name: Test documentation updater

on:
  push:
    paths:
      - update_docs.py
      - tests/**
      - requirements.txt
      - .github/workflows/**
  pull_request:
    paths:
      - update_docs.py
      - tests/**
      - requirements.txt
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
