name: Update LangChain documentation

on:
  schedule:
    # GitHub Actions cron schedules use UTC. Run daily at 04:23 UTC.
    - cron: "23 04 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-langchain-documentation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # The October 19 crawl took 167 minutes for about 9000 routes. Leave room
    # for delayed recovery of failed downloads and final normalization.
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install updater dependencies
        run: python -m pip install -r requirements.txt

      - name: Test updater
        run: python -m unittest discover -s tests

      - name: Update documentation mirror
        id: mirror
        shell: bash
        run: |
          set -o pipefail
          python -u update_docs.py 2>&1 | tee "$RUNNER_TEMP/mirror-update.log"

      - name: Preserve failed update diagnostics
        if: failure() && steps.mirror.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mirror-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mirror-update.log
            .mirror-manifest.json
          include-hidden-files: true
          retention-days: 14

      - name: Commit and push changes
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            trigger="scheduled"
          else
            trigger="$GITHUB_EVENT_NAME by $GITHUB_ACTOR"
          fi
          git commit -m "docs: automated update $(date -u +%F) ($trigger)"
          # A human may push code while this multi-hour crawl is running.
          # Rebase the generated commit onto that work; never force-push.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push documentation after three attempts." >&2
          exit 1
