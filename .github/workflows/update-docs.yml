name: Update LangChain documentation

on:
  schedule:
    # GitHub Actions cron schedules use UTC. Run once every day.
    - cron: "23 04 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-langchain-documentation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install updater dependency
        run: python -m pip install -r requirements.txt

      - name: Test Markdown normalization
        run: python -m unittest discover -s tests

      - name: Update documentation mirror
        run: python update_docs.py

      - name: Commit and push changes
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: automated update $(date -u +%F)"
          git push
